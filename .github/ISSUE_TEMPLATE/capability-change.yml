name: Capability change
description: Propose or change a reusable capability
title: "[capability] "
labels: ["capability"]
body:
  - type: input
    id: consumers
    attributes:
      label: Current and proposed consumers
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract change
      description: Inputs, outputs, failures, evidence, and compatibility
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Proposed maintenance owner
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test and migration plan
    validations:
      required: true
