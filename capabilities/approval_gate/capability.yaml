{
  "schema_version": "1.0",
  "id": "approval_gate",
  "version": "1.0.0",
  "status": "reference",
  "owner_role": "automation-content-owner",
  "summary": "Validate that an approved workflow context permits progression.",
  "inputs": ["approval_status", "approval_reference", "approval_allowed_statuses"],
  "outputs": ["approval_gate_result"],
